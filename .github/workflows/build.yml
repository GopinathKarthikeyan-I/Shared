name: Build SmartCam APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q .github/workflows/SmartCam.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: SmartCam
        run: |
          if [ -f signing/smartcam.jks.b64 ]; then base64 -d signing/smartcam.jks.b64 > app/smartcam.jks; fi
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../SmartCam-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SmartCam build ${{ github.run_number }}
          files: SmartCam-${{ github.run_number }}.apk
